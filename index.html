<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Position Generator</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='64' height='64' rx='12' fill='%231a1a2e'/%3E%3Ccircle cx='14' cy='38' r='5' stroke='white' stroke-width='2'/%3E%3Cline x1='19' y1='38' x2='42' y2='40' stroke='white' stroke-width='2'/%3E%3Cline x1='42' y1='40' x2='54' y2='52' stroke='white' stroke-width='2'/%3E%3Cline x1='42' y1='40' x2='52' y2='32' stroke='white' stroke-width='2'/%3E%3Cline x1='24' y1='36' x2='26' y2='28' stroke='white' stroke-width='2'/%3E%3Cline x1='24' y1='40' x2='26' y2='48' stroke='white' stroke-width='2'/%3E%3Ccircle cx='22' cy='22' r='5' stroke='%23e94560' stroke-width='2'/%3E%3Cline x1='27' y1='25' x2='40' y2='33' stroke='%23e94560' stroke-width='2'/%3E%3Cline x1='40' y1='33' x2='50' y2='42' stroke='%23e94560' stroke-width='2'/%3E%3Cline x1='40' y1='33' x2='50' y2='26' stroke='%23e94560' stroke-width='2'/%3E%3Cline x1='31' y1='27' x2='22' y2='34' stroke='%23e94560' stroke-width='2'/%3E%3Cline x1='31' y1='30' x2='34' y2='38' stroke='%23e94560' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: clamp(20px, 5vw, 40px);
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            cursor: pointer;
            touch-action: manipulation;
        }

        .card:active {
            transform: scale(0.97);
        }

        @media (hover: hover) {
            .card:hover {
                transform: translateY(-2px);
            }
        }

        .illustration {
            width: clamp(150px, 50vw, 220px);
            height: clamp(150px, 50vw, 220px);
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(233, 69, 96, 0.3);
            overflow: hidden;
        }

        .illustration img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(233, 69, 96, 0.3));
        }

        .illustration svg {
            width: 75%;
            height: 75%;
        }

        .position-name {
            font-size: clamp(1.2rem, 4.5vw, 1.6rem);
            font-weight: 700;
            margin-bottom: 10px;
            color: #ff6b6b;
        }

        .position-desc {
            font-size: clamp(0.85rem, 3vw, 0.95rem);
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: clamp(0.8rem, 3vw, 0.85rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .filter-chip:active {
            transform: scale(0.95);
        }

        @media (hover: hover) {
            .filter-chip:hover {
                border-color: rgba(255, 255, 255, 0.3);
                color: rgba(255, 255, 255, 0.7);
            }
        }

        .filter-chip.active.facile {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
            border-color: rgba(46, 213, 115, 0.5);
        }

        .filter-chip.active.moyen {
            background: rgba(255, 165, 2, 0.2);
            color: #ffa502;
            border-color: rgba(255, 165, 2, 0.5);
        }

        .filter-chip.active.avance {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            border-color: rgba(233, 69, 96, 0.5);
        }

        .filter-chip.active.coquin {
            background: rgba(192, 132, 252, 0.2);
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.5);
        }

        .hint {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 16px;
        }

        .fade-in {
            animation: fadeSlide 0.5s ease forwards;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .difficulty {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .difficulty.facile {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .difficulty.moyen {
            background: rgba(255, 165, 2, 0.2);
            color: #ffa502;
            border: 1px solid rgba(255, 165, 2, 0.3);
        }

        .difficulty.avance {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }

        .difficulty.coquin {
            background: rgba(192, 132, 252, 0.2);
            color: #c084fc;
            border: 1px solid rgba(192, 132, 252, 0.3);
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }

        .list-toggle {
            margin-top: 14px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.2s;
        }

        .list-toggle:active,
        .list-toggle:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        .list-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .list-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .list-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85dvh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px 20px 0 0;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .list-panel.open {
            transform: translateY(0);
        }

        .list-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .list-panel-header h2 {
            font-size: 1rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
        }

        .list-panel-close {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .list-handle {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            margin: 10px auto 0;
            flex-shrink: 0;
        }

        .list-body {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 8px 16px 16px;
            overscroll-behavior: contain;
        }

        .list-section {
            margin-bottom: 16px;
        }

        .list-section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 4px;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #1a1a2e, #16213e);
            z-index: 1;
        }

        .list-section-title.facile { color: #2ed573; }
        .list-section-title.moyen { color: #ffa502; }
        .list-section-title.avance { color: #e94560; }
        .list-section-title.coquin { color: #c084fc; }

        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            border-radius: 10px;
            transition: background 0.15s;
        }

        .list-item:active {
            background: rgba(255, 255, 255, 0.06);
        }

        .list-item-icon {
            width: 52px;
            height: 52px;
            min-width: 52px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .list-item-icon img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .list-item-icon svg {
            width: 36px;
            height: 36px;
        }

        .list-item-text {
            flex: 1;
            min-width: 0;
        }

        .list-item-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 2px;
        }

        .list-item-desc {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Zoom overlay */
        .zoom-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            cursor: zoom-out;
            padding: 20px;
        }

        .zoom-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .zoom-overlay img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.4));
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .zoom-overlay.open img {
            transform: scale(1);
        }

        .zoom-hint {
            position: absolute;
            bottom: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }

        .illustration {
            cursor: zoom-in;
        }

        .fav-btn {
            position: absolute;
            top: clamp(14px, 3vw, 22px);
            right: clamp(14px, 3vw, 22px);
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            z-index: 2;
        }

        .fav-btn svg {
            width: 18px;
            height: 18px;
            transition: all 0.2s ease;
        }

        .fav-btn:active { transform: scale(0.8); }

        .fav-btn.active {
            background: rgba(233, 69, 96, 0.15);
        }

        .fav-btn.active svg {
            fill: #e94560;
            stroke: #e94560;
        }

        .fav-bar {
            display: flex;
            gap: 8px;
            padding: 8px 16px 4px;
            flex-shrink: 0;
        }

        .fav-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .fav-chip:active { transform: scale(0.95); }

        .fav-chip.active {
            background: rgba(233, 69, 96, 0.15);
            border-color: rgba(233, 69, 96, 0.3);
            color: #e94560;
        }

        .fav-chip svg {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
        }

        .fav-chip.danger { margin-left: auto; }

        .list-item-fav {
            width: 30px;
            height: 30px;
            min-width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-left: auto;
            flex-shrink: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .list-item-fav:active { transform: scale(0.8); }

        .list-item-fav svg {
            width: 15px;
            height: 15px;
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .filters {
                gap: 8px;
                margin-bottom: 16px;
            }
        }

        @media (max-height: 700px) {
            h1 {
                margin-bottom: 12px;
            }

            .illustration {
                width: 130px;
                height: 130px;
                margin-bottom: 14px;
            }

            .position-desc {
                margin-bottom: 12px;
            }

            footer {
                margin-top: 12px;
            }
        }

        /* ===== TIMER ===== */
        .timer-wrap {
            display: flex;
            justify-content: center;
            margin: 8px 0 4px;
        }

        .timer-circle {
            position: relative;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-ring {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 3;
        }

        .timer-progress {
            fill: none;
            stroke: #e94560;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 113.1;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        .timer-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.75);
            position: relative;
            letter-spacing: 0.5px;
        }

        .timer-circle.done .timer-progress { stroke: #2ed573; }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.2); }
        }

        .timer-circle.done { animation: timerPulse 0.25s ease 3; }

        /* ===== ZOOM SVG ===== */
        #zoomSvgWrap {
            width: min(70vw, 70vh);
            height: min(70vw, 70vh);
            display: none;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.4));
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .zoom-overlay.open #zoomSvgWrap { transform: scale(1); }
        #zoomSvgWrap svg { width: 100%; height: 100%; }

        /* ===== Settings / DataSafe ===== */
        .settings-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: background 0.2s, color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.14); color: white; }

        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .settings-overlay.open { display: flex; }

        .settings-modal {
            background: #16213e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }
        .settings-modal h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .settings-subtitle {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.35);
            margin-bottom: 20px;
        }
        .settings-field { margin-bottom: 14px; }
        .settings-field label {
            display: block;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.55);
            margin-bottom: 5px;
        }
        .settings-field input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .settings-field input:focus { border-color: rgba(233,69,96,0.55); }
        .settings-field input::placeholder { color: rgba(255,255,255,0.22); }

        .settings-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .settings-actions button {
            flex: 1;
            padding: 11px;
            border-radius: 12px;
            border: none;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            font-family: inherit;
        }
        .settings-actions button:active { opacity: 0.75; }
        .btn-cancel { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.65); }
        .btn-save { background: linear-gradient(90deg,#e94560,#ff6b6b); color: #fff; }
        .btn-export {
            background: rgba(233,69,96,0.1);
            border: 1px solid rgba(233,69,96,0.35) !important;
            color: #e94560;
        }

        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(14px);
            background: rgba(22,33,62,0.97);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 12px;
            padding: 11px 20px;
            color: #fff;
            font-size: 0.84rem;
            z-index: 400;
            opacity: 0;
            transition: opacity 0.28s, transform 0.28s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: rgba(80,200,120,0.45); }
        .toast.error   { border-color: rgba(233,69,96,0.5); }
    </style>
</head>
<body>

    <h1>Position Generator</h1>

    <div class="filters">
        <div class="filter-chip active facile" data-level="facile" onclick="toggleFilter(this)">Facile</div>
        <div class="filter-chip active moyen" data-level="moyen" onclick="toggleFilter(this)">Moyen</div>
        <div class="filter-chip active avance" data-level="avance" onclick="toggleFilter(this)">Avancé</div>
        <div class="filter-chip active coquin" data-level="coquin" onclick="toggleFilter(this)">Coquin</div>
    </div>

    <div class="card" id="card" onclick="generate()" style="position:relative">
        <button class="fav-btn" id="favBtn" onclick="toggleFav(event)" title="Ajouter aux favoris">
            <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <div class="illustration" id="illustration" onclick="openZoom(event)"></div>
        <div class="difficulty" id="difficulty"></div>
        <div class="position-name" id="positionName"></div>
        <div class="position-desc" id="positionDesc"></div>

        // Précharger les images
        positions.forEach(p => {
            if (p.img) {
                const i = new Image();
                i.src = IMG_BASE + p.img;
            }
        });

        let lastIndex = -1;
        let activeFilters = new Set(['facile', 'moyen', 'avance', 'coquin']);
        let favorites = new Set(JSON.parse(localStorage.getItem('favorites') || '[]'));
        let showFavOnly = false;

        const TIMER_CIRC = 2 * Math.PI * 18; // 113.1
        let timerInterval = null;
        let timerTotal = 0;
        let timerLeft = 0;

        function startTimer() {
            clearInterval(timerInterval);
            timerTotal = 30 + Math.floor(Math.random() * 61); // 30–90 s
            timerLeft = timerTotal;
            document.getElementById('timerCircle').classList.remove('done');
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timerLeft--;
                updateTimerDisplay();
                if (timerLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    document.getElementById('timerCircle').classList.add('done');
                    playBeep();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timerLeft / 60);
            const s = timerLeft % 60;
            document.getElementById('timerLabel').textContent = m + ':' + String(s).padStart(2, '0');
            document.getElementById('timerProgress').style.strokeDashoffset =
                TIMER_CIRC * (1 - timerLeft / timerTotal);
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [0, 0.25, 0.5].forEach(t => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 880;
                    gain.gain.setValueAtTime(0.4, ctx.currentTime + t);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2);
                    osc.start(ctx.currentTime + t);
                    osc.stop(ctx.currentTime + t + 0.2);
                });
            } catch (e) {}
        }

        function toggleFilter(el) {
            const level = el.dataset.level;
            if (activeFilters.has(level)) {
                if (activeFilters.size <= 1) return;
                activeFilters.delete(level);
                el.classList.remove('active');
            } else {
                activeFilters.add(level);
                el.classList.add('active');
            }
            generate();
        }

        function showPosition(pos, animate) {
            const card = document.getElementById('card');
            const illustration = document.getElementById('illustration');
            const name = document.getElementById('positionName');
            const desc = document.getElementById('positionDesc');
            const diff = document.getElementById('difficulty');

            if (animate) {
                card.classList.remove('fade-in');
                void card.offsetWidth;
                card.classList.add('fade-in');
            }

            if (pos.img) {
                illustration.innerHTML = `<img src="${IMG_BASE}${pos.img}" alt="${pos.name}" loading="lazy"/>`;
            } else if (pos.svg) {
                illustration.innerHTML = pos.svg;
            }

            name.textContent = pos.name;
            desc.textContent = pos.desc;
            diff.textContent = pos.difficulty === 'facile' ? 'Facile' :
                              pos.difficulty === 'moyen' ? 'Moyen' :
                              pos.difficulty === 'coquin' ? 'Coquin' : 'Avancé';
            diff.className = 'difficulty ' + pos.difficulty;
            document.getElementById('favBtn').classList.toggle('active', favorites.has(pos.name));
        }

        function generate() {
            const filtered = positions.filter(p => activeFilters.has(p.difficulty));
            if (filtered.length === 0) return;

            let index;
            do {
                index = Math.floor(Math.random() * filtered.length);
            } while (filtered[index] === positions[lastIndex] && filtered.length > 1);

            const pos = filtered[index];
            lastIndex = positions.indexOf(pos);
            showPosition(pos, true);
            startTimer();
        }

        function openZoom(e) {
            e.stopPropagation();
            if (lastIndex < 0) return;
            const pos = positions[lastIndex];
            const img = document.getElementById('zoomImg');
            const svgWrap = document.getElementById('zoomSvgWrap');
            if (pos.img) {
                img.src = IMG_BASE + pos.img;
                img.alt = pos.name;
                img.style.display = '';
                svgWrap.style.display = 'none';
                svgWrap.innerHTML = '';
            } else if (pos.svg) {
                img.style.display = 'none';
                svgWrap.innerHTML = pos.svg;
                svgWrap.style.display = 'flex';
            } else {
                return;
            }
            document.getElementById('zoomOverlay').classList.add('open');
        }

        function closeZoom() {
            document.getElementById('zoomOverlay').classList.remove('open');
        }

        function toggleFav(e) {
            e.stopPropagation();
            if (lastIndex < 0) return;
            const name = positions[lastIndex].name;
            if (favorites.has(name)) {
                favorites.delete(name);
            } else {
                favorites.add(name);
            }
            localStorage.setItem('favorites', JSON.stringify([...favorites]));
            document.getElementById('favBtn').classList.toggle('active', favorites.has(name));
        }

        function toggleFavFilter() {
            showFavOnly = !showFavOnly;
            document.getElementById('favFilter').classList.toggle('active', showFavOnly);
            buildList();
        }

        function clearFavorites() {
            if (!favorites.size) return;
            favorites.clear();
            localStorage.setItem('favorites', '[]');
            if (lastIndex >= 0) document.getElementById('favBtn').classList.remove('active');
            showFavOnly = false;
            document.getElementById('favFilter').classList.remove('active');
            buildList();
        }

        function buildList() {
            const body = document.getElementById('listBody');
            const groups = { facile: [], moyen: [], avance: [], coquin: [] };
            positions.forEach((p, i) => {
                if (showFavOnly && !favorites.has(p.name)) return;
                groups[p.difficulty].push({ ...p, idx: i });
            });

            document.getElementById('favFilterLabel').textContent = `Favoris (${favorites.size})`;
            document.getElementById('favClear').style.display = favorites.size ? 'flex' : 'none';

            const labels = { facile: 'Facile', moyen: 'Moyen', avance: 'Avancé', coquin: 'Coquin' };
            let html = '';
            for (const [level, items] of Object.entries(groups)) {
                if (!items.length) continue;
                html += `<div class="list-section">
                    <div class="list-section-title ${level}">${labels[level]} (${items.length})</div>`;
                items.forEach(p => {
                    const icon = p.img
                        ? `<img src="${IMG_BASE}${p.img}" alt="${p.name}" loading="lazy"/>`
                        : (p.svg || '');
                    const isFav = favorites.has(p.name);
                    const heartSvg = isFav
                        ? '<svg viewBox="0 0 24 24" fill="#e94560" stroke="#e94560" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
                        : '<svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
                    html += `<div class="list-item" onclick="selectPosition(${p.idx})">
                        <div class="list-item-icon">${icon}</div>
                        <div class="list-item-text">
                            <div class="list-item-name">${p.name}</div>
                            <div class="list-item-desc">${p.desc}</div>
                        </div>
                        <div class="list-item-fav" onclick="toggleListFav(event, ${p.idx})">${heartSvg}</div>
                    </div>`;
                });
                html += '</div>';
            }
            if (showFavOnly && !html) {
                html = '<div style="text-align:center;padding:40px 20px;color:rgba(255,255,255,0.3)">Aucun favori pour le moment</div>';
            }
            body.innerHTML = html;
        }

        function selectPosition(idx) {
            lastIndex = idx;
            showPosition(positions[idx], true);
            closeList();
            startTimer();
        }

        function openList() {
            buildList();
            document.getElementById('listOverlay').classList.add('open');
            document.getElementById('listPanel').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeList() {
            document.getElementById('listOverlay').classList.remove('open');
            document.getElementById('listPanel').classList.remove('open');
            document.body.style.overflow = '';
        }

        // Hint adaptatif
        const hint = document.getElementById('hint');
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        hint.textContent = isTouchDevice ? 'Touche pour générer' : 'Clique ou appuie sur Espace';

        // Générer au chargement
        generate();

        // Raccourci clavier (Espace)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Escape') { closeZoom(); closeSettings(); return; }
            if (e.code === 'Space') {
                e.preventDefault();
                generate();
            }
        });

        function toggleListFav(e, idx) {
            e.stopPropagation();
            const name = positions[idx].name;
            if (favorites.has(name)) favorites.delete(name);
            else favorites.add(name);
            localStorage.setItem('favorites', JSON.stringify([...favorites]));
            if (lastIndex >= 0) document.getElementById('favBtn').classList.toggle('active', favorites.has(positions[lastIndex].name));
            buildList();
        }

        // ===== Settings & DataSafe =====

        function openSettings() {
            document.getElementById('dsUrl').value = localStorage.getItem('ds_url') || '';
            document.getElementById('dsKey').value = localStorage.getItem('ds_key') || '';
            document.getElementById('dsApp').value = localStorage.getItem('ds_app') || '';
            document.getElementById('settingsOverlay').classList.add('open');
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').classList.remove('open');
        }

        function closeSettingsBg(e) {
            if (e.target === document.getElementById('settingsOverlay')) closeSettings();
        }

        function saveSettings() {
            localStorage.setItem('ds_url', document.getElementById('dsUrl').value.trim());
            localStorage.setItem('ds_key', document.getElementById('dsKey').value.trim());
            localStorage.setItem('ds_app', document.getElementById('dsApp').value.trim());
            closeSettings();
            showToast('Paramètres enregistrés', 'success');
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (type ? ' ' + type : '');
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function downloadJson(data) {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'position-generator-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        async function exportData() {
            const dsUrl = localStorage.getItem('ds_url') || '';
            const dsKey  = localStorage.getItem('ds_key') || '';
            const dsApp  = localStorage.getItem('ds_app') || '';

            // Collect all localStorage keys
            const lsData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                try { lsData[k] = JSON.parse(localStorage.getItem(k)); }
                catch { lsData[k] = localStorage.getItem(k); }
            }

            const payload = {
                _meta: {
                    exportedAt: new Date().toISOString(),
                    storage: ['localStorage']
                },
                ...lsData
            };

            const configured = dsUrl && dsKey && dsApp;
            if (configured) {
                payload._datasafe = { apiKey: dsKey, url: dsUrl, appName: dsApp };
                try {
                    const res = await fetch(dsUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + dsKey,
                            'X-App-Name': dsApp
                        },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const json = await res.json();
                        showToast('✓ Sauvegardé (v' + (json.versions ?? '?') + ')', 'success');
                        return;
                    }
                } catch (_) {}
                // Réseau KO → fallback téléchargement
                downloadJson(payload);
                showToast('Réseau indisponible — fichier téléchargé', 'error');
            } else {
                downloadJson(payload);
                showToast('Export téléchargé', 'success');
            }
        }

        // Swipe support (card)
        let touchStartY = 0;
        const card = document.getElementById('card');
        card.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });
        card.addEventListener('touchend', (e) => {
            const dy = touchStartY - e.changedTouches[0].clientY;
            if (Math.abs(dy) > 40) generate();
        }, { passive: true });
    </script>
</body>
</html>
